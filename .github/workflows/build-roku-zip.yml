name: Build Roku Plus ZIP
on:
  push:
    branches:
      - fix/hls-native-startup-diagnostics-3.5.20
      - test/hls-first-frame-3.5.21
      - test/hls-first-frame-3.5.24
      - test/hls-segment-url-3.5.27
      - test/hls-direct-ts-3.5.27
      - test/hls-sequential-ts-3.5.28
      - test/hls-first-segment-ts-3.5.30
      - test/hls-master-playlist-3.5.31
      - test/hls-segment-boundary-3.5.32
      - test/hls-timestamp-boundary-3.5.33
      - test/hls-second-segment-ts-3.5.34
      - test/hls-sequential-ts-3.5.35
      - test/hls-native-playlist-ts-3.5.36
      - test/hls-segment-idr-diagnostic-3.5.37
      - test/hls-native-audio-isolation-3.5.38
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source package
        run: |
          zip -qr /tmp/Roku-Plus-3.5.38.zip . -x './.git/*' './.github/*' '*.zip'
          mv /tmp/Roku-Plus-3.5.37.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Plus-3.5.38
          path: Roku-Plus-3.5.38.zip
          if-no-files-found: error
          retention-days: 7

