      - restore/native-player-3.5.79
      - test/ts-single-connection-3.5.80
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source package
        shell: bash
        run: |
          VERSION="$(awk -F= '
            /^major_version=/ { major=$2 }
            /^minor_version=/ { minor=$2 }
            /^build_version=/ { build=$2 }
            END {
              if (major == "" || minor == "" || build == "") exit 1
              printf "%s.%s.%s", major, minor, build
            }
          ' manifest)"
          PACKAGE_NAME="Roku-Plus-${VERSION}"
          zip -qr "/tmp/${PACKAGE_NAME}.zip" . -x './.git/*' './.github/*' '*.zip'
          mv "/tmp/${PACKAGE_NAME}.zip" .
          echo "PACKAGE_NAME=${PACKAGE_NAME}" >> "$GITHUB_ENV"
          echo "PACKAGE_PATH=${PACKAGE_NAME}.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7

