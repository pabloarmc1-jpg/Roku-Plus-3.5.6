name: Build Roku Plus ZIP
on:
  push:
    branches:
      - fix/lamovie-native-segment-diagnostics-3.5.10
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source package
        run: |
          zip -qr Roku-Plus-3.5.10.zip . -x '.git/*' '.github/*' 'Roku-Plus-3.5.10.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Plus-3.5.10
          path: Roku-Plus-3.5.10.zip
          if-no-files-found: error
          retention-days: 7
