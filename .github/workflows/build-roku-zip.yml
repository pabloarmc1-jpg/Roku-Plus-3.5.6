name: Build Roku Plus ZIP
on:
  push:
    branches:
      - fix/hls-native-startup-diagnostics-3.5.20
      - test/hls-first-frame-3.5.21
      - test/hls-first-frame-3.5.24
      - test/hls-segment-url-3.5.27
      - test/hls-direct-ts-3.5.27
      - test/hls-sequential-ts-3.5.28
      - test/hls-first-segment-ts-3.5.30
      - test/hls-master-playlist-3.5.31
      - test/hls-segment-boundary-3.5.32
      - test/hls-timestamp-boundary-3.5.33
      - test/hls-second-segment-ts-3.5.34
      - test/hls-sequential-ts-3.5.35
      - test/hls-native-playlist-ts-3.5.36
      - test/hls-segment-idr-diagnostic-3.5.37
      - test/hls-native-audio-isolation-3.5.38
      - test/hls-native-event-diagnostics-3.5.41
      - test/hls-ui-isolation-3.5.42
      - test/hls-minimal-startup-3.5.43
      - test/hls-decode-memory-cap-3.5.44
      - test/hls-fresh-content-restart-3.5.46
      - test/hls-variant-528p-3.5.47
      - test/hls-explicit-prebuffer-3.5.48
      - test/hls-reference-stream-3.5.49
      - test/hls-lamovie-480p-3.5.50
      - test/hls-id3-clean-ts-3.5.51
      - test/hls-clean-playlist-tool-3.5.53
      - test/hls-manifest-audit-3.5.53
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source package
        run: |
          zip -qr /tmp/Roku-Plus-3.5.53.zip . -x './.git/*' './.github/*' '*.zip'
          mv /tmp/Roku-Plus-3.5.53.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Plus-3.5.53
          path: Roku-Plus-3.5.53.zip
          if-no-files-found: error
          retention-days: 7

