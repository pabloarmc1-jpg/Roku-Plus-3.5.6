name: Build Roku Plus ZIP
on:
  push:
    branches:
      - fix/hls-master-audio-selection-3.5.18
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source package
        run: |
          zip -qr /tmp/Roku-Plus-3.5.18.zip . -x './.git/*' './.github/*' '*.zip'
          mv /tmp/Roku-Plus-3.5.18.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Plus-3.5.18
          path: Roku-Plus-3.5.18.zip
          if-no-files-found: error
          retention-days: 7
