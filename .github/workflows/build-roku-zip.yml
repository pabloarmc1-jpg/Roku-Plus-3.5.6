name: Build Roku Plus ZIP
on:
  push:
    branches:
      - fix/hls-native-startup-diagnostics-3.5.20
      - test/hls-first-frame-3.5.21
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Create source package
        run: |
          zip -qr /tmp/Roku-Plus-3.5.21.zip . -x './.git/*' './.github/*' '*.zip'
          mv /tmp/Roku-Plus-3.5.21.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Roku-Plus-3.5.21
          path: Roku-Plus-3.5.21.zip
          if-no-files-found: error
          retention-days: 7
